name: Offline Verify

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  offline-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python spike dependencies
        run: python -m pip install -r apps/spike/requirements.txt

      - name: Offline verification
        run: pnpm verify:offline
